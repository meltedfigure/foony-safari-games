name: Safari games check

# Plays every live game on foony.com in real Safari, on GitHub's Mac machines: Mac Safari and
# iOS Simulator Safari (iPhone and iPad). Each game is started against bots in a private room,
# tapped around, screenshotted and checked for crashes, the crash screen, sideways scroll and
# page errors. The script is sweep.mjs.
#
# Manual start only: Actions > Safari games check > Run workflow. This repo is public, so GitHub's
# Mac machines cost nothing here. Keep it public, or every Mac minute bills the owner's account.
# One target takes about 30 minutes for all games.
#
# Old iOS: GitHub's machines only have the newest iOS versions. A target with an exact older
# version, e.g. "iPhone 8 @ 15.5", downloads that iOS Simulator from Apple first (5 to 8 GB, about
# 10 more minutes). Apple offers 15.0, 15.2, 15.4, 15.5, 16.0, 16.1, 16.2, 16.4, 17.0, 17.2, 17.4 and
# 17.5. Nothing older than iOS 15 runs on these machines.
#
# Results: each target uploads an artifact with screenshots and results.jsonl, and the run's
# summary page shows a table per target.

on:
  workflow_dispatch:
    inputs:
      targets:
        description: '"mac" for Mac Safari, or iOS Simulator devices, comma separated. "iPhone 16" uses the newest iOS, "iPhone 16 @ 18" the newest iOS 18. A name that is not exact picks the first device that starts with it. "iPhone 8 @ 15.5" downloads iOS 15.5 (exact device name and version). Add " on macos-26" to a target to use that machine image.'
        default: 'mac,iPhone SE,iPhone 16,iPhone 16 @ 18,iPhone 16 Pro Max,iPad mini'
      games:
        description: '"all" for every game linked from foony.com/games, or slugs, comma separated (e.g. chess,ludo)'
        default: 'all'

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    name: List the targets
    outputs:
      targets: ${{ steps.split.outputs.targets }}
    steps:
      - id: split
        env:
          TARGETS: ${{ inputs.targets }}
        # Each target becomes {target, runner}. "iPhone 17 on macos-26" runs on that image, which has
        # newer iOS versions. The default is pinned, not macos-latest: the iOS Simulator device names
        # and Safari versions come with the image's Xcode, so a silent image change would rename the targets.
        run: |
          echo "targets=$(jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0)) | map(capture("^(?<target>.*?)(\\s+on\\s+(?<runner>macos-[0-9]+))?$") | {target, runner: (.runner // "macos-15")})' <<< "$TARGETS")" >> "$GITHUB_OUTPUT"

  sweep:
    needs: plan
    name: Safari on ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    # A full run of all games takes 20 to 40 minutes, plus up to 15 minutes to boot a simulator. The
    # limit stops a stuck Safari from holding a Mac machine for GitHub's default of 6 hours.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Boot the iOS Simulator
        if: matrix.target != 'mac'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # "iPhone 16 @ 18" limits the pick to iOS 18 runtimes. Then the exact name on the newest
          # runtime first, else the first name that starts with it.
          version=""
          requested=""
          if [[ "$TARGET" == *@* ]]; then
            requested=$(echo "${TARGET#*@}" | tr -d ' ')
            version=$(echo "$requested" | tr '.' '-')
            TARGET=$(echo "${TARGET%%@*}" | sed 's/ *$//')
          fi
          # "18" matches iOS 18.5 and 18.6 but not 1.8, and no version matches every iOS.
          export RUNTIME_PATTERN="iOS-${version:+$version(\$|-)}"
          list_devices() {
            xcrun simctl list devices available --json | jq -c '[.devices | to_entries[] | select(.key | test($ENV.RUNTIME_PATTERN)) | .key as $runtime | .value[] | {name, udid, runtime: $runtime}] | sort_by(.runtime | capture("iOS-(?<version>[0-9-]+)").version | split("-") | map(tonumber)) | reverse'
          }
          find_runtime() {
            xcrun simctl list runtimes --json | jq -r '[.runtimes[] | select(.isAvailable and (.identifier | test($ENV.RUNTIME_PATTERN)))][0].identifier // empty'
          }
          if [ -n "$version" ] && [ -z "$(find_runtime)" ]; then
            # This machine has no iOS Simulator of that version, so get it from Apple. xcodebuild
            # knows the new download format and xcodes the old ones, so try both.
            echo "::group::Download the iOS $requested Simulator from Apple"
            xcodebuild -downloadPlatform iOS -buildVersion "$requested" || sudo xcodes runtimes install "iOS $requested" || true
            xcrun simctl list runtimes
            echo "::endgroup::"
            if [ -z "$(find_runtime)" ]; then
              echo "::error::Could not install the iOS $requested Simulator. Apple offers these versions:"
              xcodes runtimes | grep '^iOS' || true
              exit 1
            fi
          fi
          devices=$(list_devices)
          if [ -n "$version" ] && [ "$(jq 'length' <<< "$devices")" = "0" ]; then
            # A downloaded iOS version comes with no devices. Make the one asked for.
            runtime=$(find_runtime)
            if ! xcrun simctl create "$TARGET" "$TARGET" "$runtime"; then
              echo "::error::iOS $requested has no device named \"$TARGET\". It supports these:"
              xcrun simctl list runtimes --json | RUNTIME="$runtime" jq -r '.runtimes[] | select(.identifier == $ENV.RUNTIME) | .supportedDeviceTypes[].name'
              exit 1
            fi
            devices=$(list_devices)
          fi
          udid=$(jq -r --arg name "$TARGET" '(map(select(.name == $name)) + map(select(.name | ascii_downcase | startswith($name | ascii_downcase))))[0].udid // empty' <<< "$devices")
          if [ -z "$udid" ]; then
            echo "::error::No iOS Simulator matches \"$TARGET\". Pick one of these names:"
            jq -r '.[] | "\(.name) (\(.runtime | sub(".*SimRuntime."; "")))"' <<< "$devices" | sort -u
            exit 1
          fi
          jq -r --arg udid "$udid" '.[] | select(.udid == $udid) | "Using \(.name) on \(.runtime | sub(".*SimRuntime."; ""))"' <<< "$devices"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          # simctl boots the device with no window. Open it in the Simulator app too, so taps
          # from safaridriver have a screen to land on.
          open -a Simulator --args -CurrentDeviceUDID "$udid"
          # A fresh simulator is still busy for a while after boot, and safaridriver gives up if
          # Safari takes over 30 s to come up. Start Safari now so it is warm when the script connects.
          xcrun simctl launch "$udid" com.apple.mobilesafari
          sleep 20
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      - name: Start safaridriver
        run: |
          # The log goes with the results, so a failed run uploads it.
          mkdir -p "$RUNNER_TEMP/safari-results"
          # Already on in GitHub's image. Turning it on again costs nothing and keeps working if
          # the image changes.
          sudo safaridriver --enable
          nohup safaridriver -p 4444 > "$RUNNER_TEMP/safari-results/safaridriver.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:4444/status > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::safaridriver did not answer on port 4444 within 30 s."
          cat "$RUNNER_TEMP/safari-results/safaridriver.log"
          exit 1

      - name: Play the games
        env:
          WEBDRIVER_URL: http://localhost:4444
          TARGET: ${{ matrix.target }}
          GAMES: ${{ inputs.games }}
          OUT_DIR: ${{ runner.temp }}/safari-results
        run: node sweep.mjs

      - name: Save what the iOS Simulator shows
        if: failure() && env.SIMULATOR_UDID != ''
        run: xcrun simctl io "$SIMULATOR_UDID" screenshot "$RUNNER_TEMP/safari-results/simulator-at-failure.png"

      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: safari ${{ matrix.target }}
          path: ${{ runner.temp }}/safari-results
          retention-days: 14
          if-no-files-found: warn
